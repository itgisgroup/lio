[build]
  base = "."
  command = "bun install --frozen-lockfile && bun run build:netlify"
  publish = "apps/website/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

# Keep the marketing SPA deep-linkable on lio.vn.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public,max-age=86400"
